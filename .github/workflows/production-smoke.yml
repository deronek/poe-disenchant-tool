name: Production smoke test

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [vercel.deployment.success]

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Production smoke test
    if: >-
      (github.event_name != 'schedule' ||
      vars.PRODUCTION_SMOKE_SCHEDULE_ENABLED == '1') &&
      (github.event_name != 'repository_dispatch' ||
      (github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.name == 'poe-disenchant-tool'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_BASE_URL: https://poe-disenchant-tool.vercel.app
      PRODUCTION_EXPECTED_COMMIT_SHA: ${{ github.event.client_payload.git.sha || '' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production smoke test
        run: pnpm test:production
