name: Update VRT Snapshots

on:
  # Trigger when a new comment is created on any issue or PR
  issue_comment:
    types: [created]
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update snapshots on"
        required: false
        default: ""

jobs:
  update:
    # Complex conditional to determine when the job should run:
    # 1. Allow manual trigger (workflow_dispatch)
    # 2. For issue_comment events:
    #    - Only trigger on PRs (not regular issues)
    #    - Only if comment contains "/update-snapshots" command
    #    - Only if author has trusted association (OWNER, MEMBER, COLLABORATOR)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/update-snapshots') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    steps:
      # Resolve PR head branch details when trigger is an issue_comment
      # This is necessary because github.head_ref and github.base_ref are not available
      # in the context of issue_comment events
      - name: Resolve PR head branch
        if: github.event_name == 'issue_comment'
        id: pr_head
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('repo', pr.head.repo.full_name);
            core.setOutput('ref', pr.head.ref);

      # Checkout the appropriate repository and branch:
      # - For manual trigger: Use specified branch or default branch
      # - For PR comment trigger: Use the PR's head branch from the resolved details
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          repository: ${{ steps.pr_head.outputs.repo || github.repository }}
          ref: ${{ github.event.inputs.branch || steps.pr_head.outputs.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Update snapshots
        run: pnpm test:vrt:update

      - name: Commit updated snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update snapshots for VRT"
          file_pattern: "src/tests/vrt/__snapshots__/**/*.png"
