name: Update VRT Snapshots

on:
  # Trigger when a new comment is created on any issue or PR
  issue_comment:
    types: [created]
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update snapshots on"
        required: false
        default: ""

jobs:
  update:
    # Manual runs require repository write access. Comment runs are restricted
    # to trusted maintainers and collaborators, who must review the PR code
    # first because it will execute with access to the repository PAT.
    # Usage: /update-snapshots <full-reviewed-commit-sha>
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/update-snapshots') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    steps:
      # Resolve PR head branch details when trigger is an issue_comment
      # This is necessary because github.head_ref and github.base_ref are not available
      # in the context of issue_comment events
      - name: Resolve PR head branch
        if: github.event_name == 'issue_comment'
        id: pr_head
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const match = context.payload.comment.body.match(
              /^\/update-snapshots[ \t]+([0-9a-fA-F]{40})[ \t]*\r?$/im
            );
            if (!match) {
              core.setFailed('Usage: /update-snapshots <full-reviewed-commit-sha>');
              return;
            }

            const reviewedSha = match[1].toLowerCase();
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            if (pr.head.sha.toLowerCase() !== reviewedSha) {
              core.setFailed(
                `Reviewed SHA ${reviewedSha} does not match current PR head ${pr.head.sha}. Review the latest commit and try again.`
              );
              return;
            }

            core.setOutput('repo', pr.head.repo.full_name);
            core.setOutput('branch', pr.head.ref);
            core.setOutput('sha', reviewedSha);

      # Checkout the appropriate repository and ref:
      # - For manual trigger: Use specified branch or default branch
      # - For PR comment trigger: Use the immutable reviewed commit
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
          repository: ${{ steps.pr_head.outputs.repo || github.repository }}
          ref: ${{ steps.pr_head.outputs.sha || github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Update snapshots
        run: pnpm test:vrt:update

      - name: Commit and push updated snapshots
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HEAD_REPOSITORY: ${{ steps.pr_head.outputs.repo || github.repository }}
          HEAD_BRANCH: ${{ steps.pr_head.outputs.branch || github.event.inputs.branch || github.ref_name }}
          REVIEWED_SHA: ${{ steps.pr_head.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "src/tests/vrt/__snapshots__/**/*.png"
          if git diff --cached --quiet; then
            echo "No snapshot changes detected."
            exit 0
          fi

          git -c core.hooksPath=/dev/null commit --no-verify -m "Update snapshots for VRT"
          remote_url="https://x-access-token:${GH_PAT}@github.com/${HEAD_REPOSITORY}.git"
          lease_args=()
          if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
            lease_args+=("--force-with-lease=refs/heads/${HEAD_BRANCH}:${REVIEWED_SHA}")
          fi

          # Atomically reject the push if the reviewed branch has moved.
          git push "${lease_args[@]}" "$remote_url" "HEAD:refs/heads/${HEAD_BRANCH}"
