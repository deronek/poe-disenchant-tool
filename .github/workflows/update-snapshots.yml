name: Update VRT Snapshots

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update snapshots on"
        required: false
        default: ""

jobs:
  update:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/update-snapshots'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head branch
        if: github.event_name == 'issue_comment'
        id: pr_head
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('repo', pr.head.repo.full_name);
            core.setOutput('ref', pr.head.ref);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          repository: ${{ steps.pr_head.outputs.repo || github.repository }}
          ref: ${{ github.event.inputs.branch || steps.pr_head.outputs.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Update snapshots
        run: pnpm test:vrt:update

      - name: Commit updated snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update snapshots for VRT"
          file_pattern: "src/tests/vrt/__snapshots__/**/*.png"
